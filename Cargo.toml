[package]
name = "kof-wing"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
description = "Transparent preservation launcher for a locally owned KOF Wing copy"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
fs_at = "0.2.1"
getrandom = "0.4"
if-addrs = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
toml = "0.9"
zip = { version = "6.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
