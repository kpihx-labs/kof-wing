[package]
name = "kof-wing"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
description = "Transparent preservation launcher for a locally owned KOF Wing copy"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
